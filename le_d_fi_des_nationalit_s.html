<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nationalities Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos DUA: Alto contraste y animaciones suaves para botones 3D */
        body { 
            background-color: #F3F4F6; 
            color: #0F172A; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-dua {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-dua:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-6 md:p-10 border-4 border-slate-800">
        
        <!-- Pantalla de Inicio -->
        <section id="start-screen" class="text-center fade-in">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-slate-900 leading-tight">
                🌍 The Nationalities Challenge
            </h1>
            <p class="text-2xl mb-8 font-medium">
                Completa las frases con la nacionalidad correcta en inglés.
            </p>
            <div class="flex justify-center bg-blue-50 border-2 border-blue-800 rounded-xl p-4 mb-8">
                <p class="text-xl font-bold flex items-center gap-3 text-left">
                    <span>💡</span> Presta atención: ¿Es el nombre del país o la nacionalidad?
                </p>
            </div>
            <button onclick="iniciarJuego()" class="btn-dua w-full bg-yellow-400 hover:bg-yellow-300 border-b-8 border-yellow-600 text-slate-900 text-3xl font-extrabold py-5 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-slate-900">
                <span>▶️</span> COMENZAR
            </button>
        </section>

        <!-- Pantalla de Juego (Paso a paso) -->
        <section id="game-screen" class="hidden text-center">
            <!-- Indicador de progreso -->
            <div class="flex justify-between items-center mb-8 border-b-4 border-slate-200 pb-4">
                <span class="text-2xl font-bold">Paso <span id="current-step">1</span> de <span id="total-steps">4</span></span>
                <span class="text-2xl font-bold bg-slate-800 text-white px-4 py-1 rounded-lg">⭐ <span id="score">0</span></span>
            </div>

            <!-- Pregunta actual -->
            <div id="question-container" class="fade-in mb-8">
                <p id="question-context" class="text-3xl font-semibold mb-2"></p>
                <p id="question-text" class="text-4xl font-extrabold text-blue-900 mb-8 bg-blue-100 p-6 rounded-xl border-4 border-blue-900"></p>
                
                <!-- Opciones -->
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Los botones se generan desde JS -->
                </div>
            </div>

            <!-- Feedback Visual (Correcto/Incorrecto) -->
            <div id="feedback-container" class="hidden rounded-xl p-6 mb-6 border-4">
                <p id="feedback-text" class="text-3xl font-extrabold flex items-center justify-center gap-4"></p>
            </div>

            <!-- Botón Siguiente -->
            <button id="next-btn" onclick="siguientePregunta()" class="hidden btn-dua w-full bg-slate-800 hover:bg-slate-700 border-b-8 border-slate-900 text-white text-3xl font-bold py-4 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-slate-400">
                <span>Siguiente Paso</span> <span>⏭️</span>
            </button>
        </section>

        <!-- Pantalla de Resultados -->
        <section id="result-screen" class="hidden text-center fade-in">
            <h2 class="text-5xl font-extrabold mb-6 text-slate-900">🏁 ¡Terminado!</h2>
            <p class="text-3xl mb-8">Has conseguido:</p>
            <div class="inline-block bg-yellow-400 border-4 border-slate-900 rounded-full w-40 h-40 flex items-center justify-center mx-auto mb-8 shadow-lg">
                <span class="text-6xl font-black text-slate-900" id="final-score">0</span>
            </div>
            <p class="text-2xl font-bold mb-8" id="final-message"></p>
            
            <button onclick="reiniciarJuego()" class="btn-dua w-full bg-emerald-500 hover:bg-emerald-400 border-b-8 border-emerald-700 text-slate-900 text-3xl font-extrabold py-5 px-8 rounded-2xl flex items-center justify-center gap-4 focus:outline-none focus:ring-4 focus:ring-slate-900">
                <span>🔄</span> JUGAR OTRA VEZ
            </button>
        </section>

    </main>

    <script>
        // Datos del juego adaptados al área de inglés
        const preguntas = [
            {
                contexto: "👨 Pierre is from Paris.",
                pregunta: "He is...",
                opciones: [
                    { texto: "French 🇫🇷", correcto: true },
                    { texto: "France 🇫🇷", correcto: false }
                ]
            },
            {
                contexto: "👩 Maria is from Madrid.",
                pregunta: "She is...",
                opciones: [
                    { texto: "Spain 🇪🇸", correcto: false },
                    { texto: "Spanish 🇪🇸", correcto: true }
                ]
            },
            {
                contexto: "👨‍👦 John and Paul are from London.",
                pregunta: "They are...",
                opciones: [
                    { texto: "Britain 🇬🇧", correcto: false },
                    { texto: "British 🇬🇧", correcto: true }
                ]
            },
            {
                contexto: "👩 Giulia is from Rome.",
                pregunta: "She is...",
                opciones: [
                    { texto: "Italian 🇮🇹", correcto: true },
                    { texto: "Italy 🇮🇹", correcto: false }
                ]
            }
        ];

        let indiceActual = 0;
        let puntuacion = 0;

        // Referencias a elementos del DOM
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContext = document.getElementById('question-context');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const scoreElement = document.getElementById('score');
        const currentStepElement = document.getElementById('current-step');
        const totalStepsElement = document.getElementById('total-steps');

        totalStepsElement.textContent = preguntas.length;

        function iniciarJuego() {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('block');
            indiceActual = 0;
            puntuacion = 0;
            actualizarPuntuacion();
            mostrarPregunta();
        }

        function mostrarPregunta() {
            // Reiniciar estado visual
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            
            const preguntaActual = preguntas[indiceActual];
            currentStepElement.textContent = indiceActual + 1;
            
            // Cargar textos
            questionContext.textContent = preguntaActual.contexto;
            questionText.textContent = preguntaActual.pregunta;

            // Crear botones de opciones
            preguntaActual.opciones.forEach((opcion, index) => {
                const btn = document.createElement('button');
                // Estilo DUA: Botones grandes, claros, con buen borde
                btn.className = `btn-dua w-full bg-white border-4 border-slate-300 hover:border-slate-800 text-slate-800 text-3xl font-bold py-6 px-4 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500`;
                btn.textContent = opcion.texto;
                btn.onclick = () => verificarRespuesta(opcion.correcto, btn);
                optionsContainer.appendChild(btn);
            });

            // Forzar animación
            const qc = document.getElementById('question-container');
            qc.classList.remove('fade-in');
            void qc.offsetWidth; 
            qc.classList.add('fade-in');
        }

        function verificarRespuesta(esCorrecto, btnSeleccionado) {
            const botones = optionsContainer.querySelectorAll('button');
            botones.forEach(btn => btn.disabled = true);

            feedbackContainer.classList.remove('hidden');
            feedbackContainer.classList.add('fade-in');
            
            if (esCorrecto) {
                puntuacion += 10;
                actualizarPuntuacion();
                // DUA: Refuerzo positivo claro con color y forma/icono
                btnSeleccionado.classList.replace('border-slate-300', 'border-emerald-600');
                btnSeleccionado.classList.replace('hover:border-slate-800', 'bg-emerald-100');
                
                feedbackContainer.className = 'rounded-xl p-6 mb-6 border-4 border-emerald-600 bg-emerald-50 fade-in';
                feedbackText.className = 'text-3xl font-extrabold flex items-center justify-center gap-4 text-emerald-800';
                feedbackText.innerHTML = '<span>✅</span> ¡Excelente! That is correct.';
            } else {
                // DUA: Corrección clara sin ser agresiva
                btnSeleccionado.classList.replace('border-slate-300', 'border-red-600');
                btnSeleccionado.classList.replace('hover:border-slate-800', 'bg-red-100');
                
                feedbackContainer.className = 'rounded-xl p-6 mb-6 border-4 border-red-600 bg-red-50 fade-in';
                feedbackText.className = 'text-3xl font-extrabold flex items-center justify-center gap-4 text-red-800';
                feedbackText.innerHTML = '<span>❌</span> ¡Cuidado! Recuerda elegir la nacionalidad.';
            }

            nextBtn.classList.remove('hidden');
            nextBtn.classList.add('fade-in');
        }

        function siguientePregunta() {
            indiceActual++;
            if (indiceActual < preguntas.length) {
                mostrarPregunta();
            } else {
                mostrarResultados();
            }
        }

        function mostrarResultados() {
            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('block');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('block');
            
            document.getElementById('final-score').textContent = puntuacion;
            
            const mensajeFinal = document.getElementById('final-message');
            if (puntuacion === 40) {
                mensajeFinal.textContent = "🏆 ¡Perfect! Eres un experto en nacionalidades.";
            } else if (puntuacion >= 20) {
                mensajeFinal.textContent = "👍 ¡Very good! Buen esfuerzo, sigue practicando.";
            } else {
                mensajeFinal.textContent = "💪 ¡Don't give up! Repasa las reglas y vuelve a intentarlo.";
            }
        }

        function reiniciarJuego() {
            resultScreen.classList.add('hidden');
            resultScreen.classList.remove('block');
            iniciarJuego();
        }
        
        function actualizarPuntuacion() {
            scoreElement.textContent = puntuacion;
        }
    </script>
</body>
</html>
